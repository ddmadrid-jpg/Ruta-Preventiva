<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta Preventiva - Dashboard Ejecutivo</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- jQuery & Select2 CSS / JS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --excel-green-header: #006100;
      --excel-green-dark: #004b00;
      --excel-total-black: #1a1a1a;
      --excel-subtotal-gray: #6c757d;
      --excel-red-highlight: #ffc7ce;
      --excel-red-text: #9c0006;
      --bg-gray: #f4f6f9;
      --card-bg: #ffffff;
      --primary-green: #2e7d32;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-gray);
      margin: 0;
      padding: 24px;
      color: #333;
    }

    /* Encabezado Principal */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .header-title h1 {
      margin: 0;
      color: var(--excel-green-dark);
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      background: #e8f5e9;
      color: var(--primary-green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tarjetas KPI Resumen Executivo */
    .kpi-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 18px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-left: 5px solid var(--excel-green-header);
    }

    .kpi-card.alert {
      border-left-color: #d32f2f;
    }

    .kpi-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .kpi-subtext {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* Panel de Filtros */
    .filter-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      flex: 1;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: bold;
      color: #444;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select2-container--default .select2-selection--multiple {
      border: 1px solid #dcdfe6 !important;
      border-radius: 6px !important;
      min-height: 38px !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice {
      background-color: var(--excel-green-header) !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 4px !important;
      padding: 2px 8px !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
      color: #ffffff !important;
      margin-right: 5px !important;
    }

    /* Tablas */
    .dashboard-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      flex: 1;
      min-width: 320px;
    }

    .table-header {
      padding: 14px 18px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      font-weight: 700;
      color: var(--excel-green-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      padding: 8px 12px;
      text-align: right;
      border-bottom: 1px solid #eef0f2;
    }

    th.left, td.left {
      text-align: left;
    }

    thead tr th {
      background-color: var(--excel-green-header);
      color: #ffffff;
      font-weight: 600;
      font-size: 12px;
    }

    tr.subtotal {
      background-color: #f1f3f5;
      color: #212529;
      font-weight: bold;
    }

    tr.total-general {
      background-color: var(--excel-total-black);
      color: #ffffff;
      font-weight: bold;
    }

    td.alert-red {
      background-color: var(--excel-red-highlight);
      color: var(--excel-red-text);
      font-weight: bold;
    }

    .qty-badge {
      font-size: 11px;
      color: #666;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <div class="header-bar">
    <div class="header-title">
      <h1><i class="fa-solid fa-chart-line"></i> Dashboard Ruta Preventiva</h1>
    </div>
    <div class="status-badge" id="status-box">
      <i class="fa-solid fa-spinner fa-spin"></i> Cargando datos...
    </div>
  </div>

  <!-- Tarjetas KPI -->
  <div class="kpi-container">
    <div class="kpi-card">
      <div class="kpi-title">Total Servicios Programados</div>
      <div class="kpi-value" id="kpi-total">0</div>
      <div class="kpi-subtext">Registros analizados</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Cumplimiento Global</div>
      <div class="kpi-value" id="kpi-cumplimiento">0%</div>
      <div class="kpi-subtext" id="kpi-ejecutados-count">0 Ejecutadas</div>
    </div>
    <div class="kpi-card alert">
      <div class="kpi-title">Visitas No Realizadas</div>
      <div class="kpi-value" id="kpi-pendientes">0%</div>
      <div class="kpi-subtext" id="kpi-no-count">0 Pendientes</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filter-card">
    <div class="filter-group">
      <label for="filter-mes"><i class="fa-regular fa-calendar"></i> Mes</label>
      <select id="filter-mes" class="select2-filter" multiple="multiple" style="width: 100%;"></select>
    </div>

    <div class="filter-group">
      <label for="filter-semana"><i class="fa-solid fa-calendar-week"></i> Semana</label>
      <select id="filter-semana" class="select2-filter" multiple="multiple" style="width: 100%;"></select>
    </div>

    <div class="filter-group">
      <label for="filter-usuario"><i class="fa-solid fa-id-badge"></i> Usuario</label>
      <select id="filter-usuario" class="select2-filter" multiple="multiple" style="width: 100%;"></select>
    </div>

    <div class="filter-group">
      <label for="filter-tecnico"><i class="fa-solid fa-user-gear"></i> Técnico</label>
      <select id="filter-tecnico" class="select2-filter" multiple="multiple" style="width: 100%;"></select>
    </div>

    <div class="filter-group">
      <label for="filter-cliente"><i class="fa-solid fa-store"></i> Cliente / Oficina</label>
      <select id="filter-cliente" class="select2-filter" multiple="multiple" style="width: 100%;"></select>
    </div>
  </div>

  <!-- Tablas Dinámicas -->
  <div class="dashboard-grid">
    <div class="table-container">
      <div class="table-header">
        <span>Resumen por Tipo de Activo</span>
      </div>
      <div id="tabla-1-container"></div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <span>Desglose por Categoría y Técnico</span>
      </div>
      <div id="tabla-2-container"></div>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHJUM26MwbPurx5FdJGQc-I-vlfwyEZYbPGeYE0F5HxEWpbMyhVeJpJKK7XjCD6No8RZCfeHgWaxZZ/pub?output=csv";
    let rawData = [];

    $(document).ready(function() {
      $('.select2-filter').select2({
        placeholder: "Todos (filtrar...)",
        allowClear: true
      });

      $('.select2-filter').on('change', function() {
        renderDashboard();
      });

      loadSheetData();
    });

    function loadSheetData() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawData = results.data;
          document.getElementById('status-box').innerHTML = `<i class="fa-solid fa-circle-check"></i> Base Actualizada (${rawData.length} registros)`;
          populateSelects();
          renderDashboard();
        },
        error: function(err) {
          document.getElementById('status-box').style.background = "#ffebee";
          document.getElementById('status-box').style.color = "#c62828";
          document.getElementById('status-box').innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error al conectar base`;
        }
      });
    }

    function populateSelects() {
      if (rawData.length === 0) return;

      const getUnique = (keyNames) => {
        let values = [];
        rawData.forEach(d => {
          for (let k of keyNames) {
            if (d[k]) { values.push(d[k]); break; }
          }
        });
        return [...new Set(values.filter(Boolean))].sort();
      };

      const fillSelect = (id, keyNames) => {
        const select = $('#' + id);
        select.empty();
        getUnique(keyNames).forEach(val => {
          select.append(new Option(val, val, false, false));
        });
        select.trigger('change.select2');
      };

      fillSelect('filter-mes', ['Mes', 'mes']);
      fillSelect('filter-semana', ['Semana', 'semana']);
      fillSelect('filter-usuario', ['Usuario', 'STCYG', 'usuario']);
      fillSelect('filter-tecnico', ['Técnico', 'Tecnico', 'Jefe de Ventas', 'tecnico']);
      fillSelect('filter-cliente', ['Nombre Receptor', 'Cliente', 'cliente', 'Oficina']);
    }

    function getFilteredData() {
      const fMes = $('#filter-mes').val() || [];
      const fSemana = $('#filter-semana').val() || [];
      const fUsuario = $('#filter-usuario').val() || [];
      const fTecnico = $('#filter-tecnico').val() || [];
      const fCliente = $('#filter-cliente').val() || [];

      return rawData.filter(d => {
        const dMes = d['Mes'] || d['mes'];
        const dSemana = d['Semana'] || d['semana'];
        const dUsuario = d['Usuario'] || d['usuario'];
        const dTecnico = d['Técnico'] || d['Tecnico'] || d['Jefe de Ventas'];
        const dCliente = d['Nombre Receptor'] || d['Cliente'] || d['Oficina'];

        const matchMes = fMes.length === 0 || fMes.includes(dMes);
        const matchSemana = fSemana.length === 0 || fSemana.includes(dSemana);
        const matchUsuario = fUsuario.length === 0 || fUsuario.includes(dUsuario);
        const matchTecnico = fTecnico.length === 0 || fTecnico.includes(dTecnico);
        const matchCliente = fCliente.length === 0 || fCliente.includes(dCliente);

        return matchMes && matchSemana && matchUsuario && matchTecnico && matchCliente;
      });
    }

    function renderDashboard() {
      const data = getFilteredData();

      let totalSI = 0;
      let totalNO = 0;

      data.forEach(d => {
        const realizada = (d['Realizada 2'] || d['Realizada'] || d['Cumplimiento'] || '').toUpperCase();
        if (realizada === "SI" || realizada === "1" || realizada === "EJECUTADA") totalSI++;
        else totalNO++;
      });

      const grandTotal = totalSI + totalNO;
      const pctSI = grandTotal > 0 ? ((totalSI / grandTotal) * 100).toFixed(1) : '0.0';
      const pctNO = grandTotal > 0 ? ((totalNO / grandTotal) * 100).toFixed(1) : '0.0';

      document.getElementById('kpi-total').innerText = grandTotal.toLocaleString();
      document.getElementById('kpi-cumplimiento').innerText = pctSI + '%';
      document.getElementById('kpi-ejecutados-count').innerText = `${totalSI.toLocaleString()} Servicios Realizados`;
      document.getElementById('kpi-pendientes').innerText = pctNO + '%';
      document.getElementById('kpi-no-count').innerText = `${totalNO.toLocaleString()} Servicios Pendientes`;

      renderTabla1(data);
      renderTabla2(data);
    }

    function renderTabla1(data) {
      const t1Stats = {};
      let total1_SI = 0, total1_NO = 0;

      data.forEach(d => {
        const tipo = d['Tipo de Activo'] || d['Activos'] || d['Categoria'] || 'Post Mix';
        const realizada = (d['Realizada 2'] || d['Realizada'] || d['Cumplimiento'] || '').toUpperCase();

        if(!t1Stats[tipo]) t1Stats[tipo] = { SI: 0, NO: 0 };
        if(realizada === "SI" || realizada === "1" || realizada === "EJECUTADA") { t1Stats[tipo].SI++; total1_SI++; }
        else { t1Stats[tipo].NO++; total1_NO++; }
      });

      let html1 = `
        <table>
          <thead>
            <tr>
              <th class="left">Tipo de Activo</th>
              <th>NO (Cant. / %)</th>
              <th>SI (Cant. / %)</th>
              <th>Total Servicios</th>
            </tr>
          </thead>
          <tbody>`;

      Object.keys(t1Stats).forEach(tipo => {
        const si = t1Stats[tipo].SI;
        const no = t1Stats[tipo].NO;
        const tot = si + no;
        const pctNO = tot > 0 ? ((no / tot) * 100).toFixed(1) + '%' : '0.0%';
        const pctSI = tot > 0 ? ((si / tot) * 100).toFixed(1) + '%' : '0.0%';

        html1 += `
          <tr>
            <td class="left"><strong>${tipo}</strong></td>
            <td>${no} <span class="qty-badge">(${pctNO})</span></td>
            <td>${si} <span class="qty-badge">(${pctSI})</span></td>
            <td><strong>${tot}</strong> <span class="qty-badge">(100%)</span></td>
          </tr>`;
      });

      const tot1_ALL = total1_SI + total1_NO;
      const pct1_NO = tot1_ALL > 0 ? ((total1_NO / tot1_ALL) * 100).toFixed(1) + '%' : '0.0%';
      const pct1_SI = tot1_ALL > 0 ? ((total1_SI / tot1_ALL) * 100).toFixed(1) + '%' : '0.0%';

      html1 += `
        <tr class="total-general">
          <td class="left">Total General</td>
          <td>${total1_NO} (${pct1_NO})</td>
          <td>${total1_SI} (${pct1_SI})</td>
          <td>${tot1_ALL} (100%)</td>
        </tr>
        </tbody></table>`;

      document.getElementById('tabla-1-container').innerHTML = html1;
    }

    function renderTabla2(data) {
      const t2Stats = {};
      data.forEach(d => {
        const cat = d['Tipo de Activo'] || d['Activos'] || d['Categoria'] || 'Post Mix';
        const usr = d['Usuario'] || 'Sin Usuario';
        const tec = d['Técnico'] || d['Tecnico'] || d['Jefe de Ventas'] || 'Sin Técnico';
        const realizada = (d['Realizada 2'] || d['Realizada'] || d['Cumplimiento'] || '').toUpperCase();

        if(!t2Stats[cat]) t2Stats[cat] = {};
        if(!t2Stats[cat][usr]) t2Stats[cat][usr] = { tecnico: tec, SI: 0, NO: 0 };
        
        if(realizada === "SI" || realizada === "1" || realizada === "EJECUTADA") t2Stats[cat][usr].SI++;
        else t2Stats[cat][usr].NO++;
      });

      let html2 = `
        <table>
          <thead>
            <tr>
              <th class="left">Categoría</th>
              <th class="left">Usuario</th>
              <th class="left">Técnico</th>
              <th>NO (Cant. / %)</th>
              <th>SI (Cant. / %)</th>
              <th>Total Servicios</th>
            </tr>
          </thead>
          <tbody>`;

      let grandNO = 0, grandSI = 0;

      Object.keys(t2Stats).forEach(cat => {
        let catSI = 0, catNO = 0;
        Object.keys(t2Stats[cat]).forEach(usr => {
          const uData = t2Stats[cat][usr];
          const tot = uData.SI + uData.NO;
          catSI += uData.SI;
          catNO += uData.NO;

          const pctNO_num = tot > 0 ? (uData.NO / tot) * 100 : 0;
          const pctNO = pctNO_num.toFixed(1) + '%';
          const pctSI = tot > 0 ? ((uData.SI / tot) * 100).toFixed(1) + '%' : '0.0%';

          const alertClass = pctNO_num > 20 ? 'alert-red' : '';

          html2 += `
            <tr>
              <td class="left">• ${cat}</td>
              <td class="left">• ${usr}</td>
              <td class="left">${uData.tecnico}</td>
              <td class="${alertClass}">${uData.NO} <span class="qty-badge">(${pctNO})</span></td>
              <td>${uData.SI} <span class="qty-badge">(${pctSI})</span></td>
              <td><strong>${tot}</strong> <span class="qty-badge">(100%)</span></td>
            </tr>`;
        });

        grandSI += catSI;
        grandNO += catNO;

        const catTot = catSI + catNO;
        const catPctNO = catTot > 0 ? ((catNO / catTot) * 100).toFixed(1) + '%' : '0.0%';
        const catPctSI = catTot > 0 ? ((catSI / catTot) * 100).toFixed(1) + '%' : '0.0%';

        html2 += `
          <tr class="subtotal">
            <td colspan="3" class="left">Total ${cat}</td>
            <td>${catNO} (${catPctNO})</td>
            <td>${catSI} (${catPctSI})</td>
            <td>${catTot} (100%)</td>
          </tr>`;
      });

      const grandALL = grandSI + grandNO;
      const grandPctNO = grandALL > 0 ? ((grandNO / grandALL) * 100).toFixed(1) + '%' : '0.0%';
      const grandPctSI = grandALL > 0 ? ((grandSI / grandALL) * 100).toFixed(1) + '%' : '0.0%';

      html2 += `
        <tr class="total-general">
          <td colspan="3" class="left">Total General</td>
          <td>${grandNO} (${grandPctNO})</td>
          <td>${grandSI} (${grandPctSI})</td>
          <td>${grandALL} (100%)</td>
        </tr>
        </tbody></table>`;

      document.getElementById('tabla-2-container').innerHTML = html2;
    }
  </script>
</body>
</html>
