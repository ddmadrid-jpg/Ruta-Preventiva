<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta Preventiva</title>
  <style>
    :root {
      --excel-green-header: #006100;
      --excel-green-dark: #004b00;
      --excel-total-black: #000000;
      --excel-subtotal-gray: #7f7f7f;
      --excel-red-highlight: #ffc7ce;
      --excel-red-text: #9c0006;
      --bg-gray: #f4f6f8;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-gray);
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: var(--excel-green-dark);
      margin-bottom: 20px;
      font-size: 28px;
    }

    .status-card {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .filter-card {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }

    .filter-group select {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .dashboard-grid {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .table-container {
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      padding: 6px 12px;
      text-align: right;
      border: 1px solid #d9d9d9;
    }

    th.left, td.left {
      text-align: left;
    }

    thead tr:nth-child(1) th, thead tr:nth-child(2) th {
      background-color: var(--excel-green-header);
      color: #ffffff;
      font-weight: bold;
    }

    tr.subtotal {
      background-color: var(--excel-subtotal-gray);
      color: #ffffff;
      font-weight: bold;
    }

    tr.total-general {
      background-color: var(--excel-total-black);
      color: #ffffff;
      font-weight: bold;
    }

    td.alert-red {
      background-color: var(--excel-red-highlight);
      color: var(--excel-red-text);
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

  <h1>Ruta Preventiva</h1>

  <div class="status-card" id="status-box">
    🔄 Cargando datos directamente desde Google Sheets...
  </div>

  <div class="filter-card">
    <div class="filter-group">
      <label for="filter-mes">Mes</label>
      <select id="filter-mes" onchange="renderTables()">
        <option value="Todos">Todos</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-semana">Semana</label>
      <select id="filter-semana" onchange="renderTables()">
        <option value="Todas" selected>(Todas)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-usuario">Usuario</label>
      <select id="filter-usuario" onchange="renderTables()">
        <option value="Todos" selected>Todos</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-tecnico">Técnico</label>
      <select id="filter-tecnico" onchange="renderTables()">
        <option value="Todos" selected>Todos</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-cliente">Cliente</label>
      <select id="filter-cliente" onchange="renderTables()">
        <option value="Todos" selected>Todos</option>
      </select>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="table-container" id="tabla-1-container"></div>
    <div class="table-container" id="tabla-2-container"></div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHJUM26MwbPurx5FdJGQc-I-vlfwyEZYbPGeYE0F5HxEWpbMyhVeJpJKK7XjCD6No8RZCfeHgWaxZZ/pub?output=csv";
    let rawData = [];

    function loadSheetData() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawData = results.data;
          document.getElementById('status-box').innerHTML = `✅ Conectado a la base de datos (${rawData.length} registros cargados).`;
          populateSelects();
          renderTables();
        },
        error: function(err) {
          document.getElementById('status-box').style.background = "#f8d7da";
          document.getElementById('status-box').style.color = "#721c24";
          document.getElementById('status-box').innerHTML = "❌ Error al cargar los datos desde Google Sheets.";
        }
      });
    }

    function populateSelects() {
      if (rawData.length === 0) return;

      const getUnique = (keyNames) => {
        let values = [];
        rawData.forEach(d => {
          for (let k of keyNames) {
            if (d[k]) { values.push(d[k]); break; }
          }
        });
        return [...new Set(values.filter(Boolean))].sort();
      };

      const fillSelect = (id, keyNames) => {
        const select = document.getElementById(id);
        const currentVal = select.value;
        select.innerHTML = '<option value="Todos">Todos</option>';
        getUnique(keyNames).forEach(val => {
          select.innerHTML += `<option value="${val}">${val}</option>`;
        });
        if (currentVal) select.value = currentVal;
      };

      fillSelect('filter-mes', ['Mes', 'mes']);
      fillSelect('filter-semana', ['Semana', 'semana']);
      fillSelect('filter-usuario', ['Usuario', 'STCYG', 'usuario']);
      fillSelect('filter-tecnico', ['Técnico', 'Tecnico', 'Jefe de Ventas', 'tecnico']);
      fillSelect('filter-cliente', ['Nombre Receptor', 'Cliente', 'cliente', 'Oficina']);
    }

    function getFilteredData() {
      const fMes = document.getElementById('filter-mes').value;
      const fSemana = document.getElementById('filter-semana').value;
      const fUsuario = document.getElementById('filter-usuario').value;
      const fTecnico = document.getElementById('filter-tecnico').value;
      const fCliente = document.getElementById('filter-cliente').value;

      return rawData.filter(d => {
        const dMes = d['Mes'] || d['mes'];
        const dSemana = d['Semana'] || d['semana'];
        const dUsuario = d['Usuario'] || d['usuario'];
        const dTecnico = d['Técnico'] || d['Tecnico'] || d['Jefe de Ventas'];
        const dCliente = d['Nombre Receptor'] || d['Cliente'] || d['Oficina'];

        return (fMes === "Todos" || dMes === fMes) &&
               (fSemana === "Todas" || dSemana === fSemana) &&
               (fUsuario === "Todos" || dUsuario === fUsuario) &&
               (fTecnico === "Todos" || dTecnico === fTecnico) &&
               (fCliente === "Todos" || dCliente === fCliente);
      });
    }

    function renderTables() {
      const data = getFilteredData();

      // --- TABLA 1 ---
      const t1Stats = {};
      let total1_SI = 0, total1_NO = 0;

      data.forEach(d => {
        const tipo = d['Tipo de Activo'] || d['Activos'] || d['Categoria'] || 'Post Mix';
        const realizada = (d['Realizada 2'] || d['Realizada'] || d['Cumplimiento'] || '').toUpperCase();

        if(!t1Stats[tipo]) t1Stats[tipo] = { SI: 0, NO: 0 };
        if(realizada === "SI" || realizada === "1" || realizada === "EJECUTADA") { t1Stats[tipo].SI++; total1_SI++; }
        else { t1Stats[tipo].NO++; total1_NO++; }
      });

      let html1 = `
        <table>
          <thead>
            <tr><th colspan="4" class="left">Suma de Servicios</th></tr>
            <tr>
              <th class="left">Tipo de Activo</th>
              <th>NO</th>
              <th>SI</th>
              <th>Total general</th>
            </tr>
          </thead>
          <tbody>`;

      Object.keys(t1Stats).forEach(tipo => {
        const si = t1Stats[tipo].SI;
        const no = t1Stats[tipo].NO;
        const tot = si + no;
        const pctNO = tot > 0 ? ((no / tot) * 100).toFixed(1) + '%' : '0.0%';
        const pctSI = tot > 0 ? ((si / tot) * 100).toFixed(1) + '%' : '0.0%';

        html1 += `
          <tr>
            <td class="left">${tipo}</td>
            <td>${pctNO}</td>
            <td>${pctSI}</td>
            <td>100%</td>
          </tr>`;
      });

      const tot1_ALL = total1_SI + total1_NO;
      const pct1_NO = tot1_ALL > 0 ? ((total1_NO / tot1_ALL) * 100).toFixed(1) + '%' : '0.0%';
      const pct1_SI = tot1_ALL > 0 ? ((total1_SI / tot1_ALL) * 100).toFixed(1) + '%' : '0.0%';

      html1 += `
        <tr class="total-general">
          <td class="left">Total general</td>
          <td>${pct1_NO}</td>
          <td>${pct1_SI}</td>
          <td>100%</td>
        </tr>
        </tbody></table>`;

      document.getElementById('tabla-1-container').innerHTML = html1;

      // --- TABLA 2 ---
      const t2Stats = {};
      data.forEach(d => {
        const cat = d['Tipo de Activo'] || d['Activos'] || d['Categoria'] || 'Post Mix';
        const usr = d['Usuario'] || 'Sin Usuario';
        const tec = d['Técnico'] || d['Tecnico'] || d['Jefe de Ventas'] || 'Sin Técnico';
        const realizada = (d['Realizada 2'] || d['Realizada'] || d['Cumplimiento'] || '').toUpperCase();

        if(!t2Stats[cat]) t2Stats[cat] = {};
        if(!t2Stats[cat][usr]) t2Stats[cat][usr] = { tecnico: tec, SI: 0, NO: 0 };
        
        if(realizada === "SI" || realizada === "1" || realizada === "EJECUTADA") t2Stats[cat][usr].SI++;
        else t2Stats[cat][usr].NO++;
      });

      let html2 = `
        <table>
          <thead>
            <tr><th colspan="6" class="left">Suma de Servicios</th></tr>
            <tr>
              <th class="left">Categoria</th>
              <th class="left">Usuario</th>
              <th class="left">Tecnico</th>
              <th>NO</th>
              <th>SI</th>
              <th>Total general</th>
            </tr>
          </thead>
          <tbody>`;

      Object.keys(t2Stats).forEach(cat => {
        let catSI = 0, catNO = 0;
        Object.keys(t2Stats[cat]).forEach(usr => {
          const uData = t2Stats[cat][usr];
          const tot = uData.SI + uData.NO;
          catSI += uData.SI;
          catNO += uData.NO;

          const pctNO_num = tot > 0 ? (uData.NO / tot) * 100 : 0;
          const pctNO = pctNO_num.toFixed(1) + '%';
          const pctSI = tot > 0 ? ((uData.SI / tot) * 100).toFixed(1) + '%' : '0.0%';

          const alertClass = pctNO_num > 20 ? 'alert-red' : '';

          html2 += `
            <tr>
              <td class="left">• ${cat}</td>
              <td class="left">• ${usr}</td>
              <td class="left">${uData.tecnico}</td>
              <td class="${alertClass}">${pctNO}</td>
              <td>${pctSI}</td>
              <td>100%</td>
            </tr>`;
        });

        const catTot = catSI + catNO;
        const catPctNO = catTot > 0 ? ((catNO / catTot) * 100).toFixed(1) + '%' : '0.0%';
        const catPctSI = catTot > 0 ? ((catSI / catTot) * 100).toFixed(1) + '%' : '0.0%';

        html2 += `
          <tr class="subtotal">
            <td colspan="3" class="left">Total ${cat}</td>
            <td>${catPctNO}</td>
            <td>${catPctSI}</td>
            <td>100%</td>
          </tr>`;
      });

      html2 += `
        <tr class="total-general">
          <td colspan="3" class="left">Total general</td>
          <td>${pct1_NO}</td>
          <td>${pct1_SI}</td>
          <td>100%</td>
        </tr>
        </tbody></table>`;

      document.getElementById('tabla-2-container').innerHTML = html2;
    }

    loadSheetData();
  </script>
</body>
</html>
